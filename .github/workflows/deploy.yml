name: Deploy WP Plugins

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/hws-*/**'
      - 'wp-content/plugins/easysteam-*/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync HWS plugins to VPS
        run: |
          rsync -avz --delete \
            --include='hws-*' --include='hws-*/**' \
            --include='easysteam-*' --include='easysteam-*/**' \
            --exclude='*' \
            wp-content/plugins/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/docker/wpsandbox/wp-content/plugins/

      - name: Verify deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "ls -la /docker/wpsandbox/wp-content/plugins/hws-adminko-api/ && echo 'Deploy OK'"
